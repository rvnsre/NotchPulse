[package]
name = "notchpulse"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A quiet signal for extraordinary open source."
default-run = "notchpulse"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pulse-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "macros"] }
dirs = "6"
base64 = "0.22"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"

