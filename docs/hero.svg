   <rect x="229" y="278" width="199" height="34" rx="8" fill="#c1ff83"/>
   <text x="280" y="300" fill="#18230d" font-size="11" font-weight="600">Run in terminal ↗</text>
   <text x="26" y="333" fill="#6d7b68" font-size="8">PRODUCT ILLUSTRATION · PLATFORM COMMANDS ADAPT AUTOMATICALLY</text>
