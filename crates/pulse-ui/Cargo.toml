[package]
name = "pulse-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pulse-core.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
gloo-events = "0.2"
gloo-render = "0.2"
gloo-timers = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "Node", "Event", "EventTarget", "MouseEvent", "KeyboardEvent", "FocusEvent", "CssStyleDeclaration", "MediaQueryList", "VisibilityState", "console"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

