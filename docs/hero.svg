  <path d="M64 582H1216" stroke="#272d27"/>
  <text x="64" y="623" fill="#d8e3d1" font-size="13" font-weight="600">20,000+ stars</text>
  <text x="64" y="647" fill="#717d6c" font-size="11">A high bar for every card.</text>
  <text x="398" y="623" fill="#d8e3d1" font-size="13" font-weight="600">Three platforms. One pulse.</text>
  <text x="398" y="647" fill="#717d6c" font-size="11">macOS · Windows · Linux</text>
  <text x="808" y="623" fill="#d8e3d1" font-size="13" font-weight="600">Personal by invitation.</text>
  <text x="808" y="647" fill="#717d6c" font-size="11">Local habits. No cloud profile.</text>
 </g>
