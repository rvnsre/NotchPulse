name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and packaging checks
        run: python scripts/validate_source.py
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Resolve workspace
        run: python scripts/resolve_dependencies.py
      - name: Normalize formatting
        run: cargo fmt --all
      - name: Core invariants
        run: cargo test --locked -p pulse-core
      - name: WASM frontend
        run: cargo clippy --locked -p pulse-ui --target wasm32-unknown-unknown -- -D warnings
      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked
      - name: Compile frontend assets
        run: trunk build --release
      - name: Browser test runner
        if: runner.os == 'Linux'
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: WASM IPC and escaping regressions
        if: runner.os == 'Linux'
        run: wasm-pack test --headless --chrome crates/pulse-ui
      - name: Native backend
        run: cargo clippy --locked -p notchpulse --all-targets -- -D warnings
      - name: Persistence and privacy tests
        run: cargo test --locked -p notchpulse
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-${{ runner.os }}
          path: Cargo.lock

