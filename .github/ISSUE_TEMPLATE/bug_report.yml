name: Bug report
description: Help make the signal better
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS version, desktop environment and display scaling
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Remove tokens, private paths, and other sensitive information.

